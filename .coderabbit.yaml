# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en
reviews:
  profile: chill
  path_filters:
    # Materialized mirrors of canonical skills/schemas — fixes land at the
    # source and propagate via sync-assets.sh; reviewing the copies is
    # redundant and pushes large PRs over the 100-file full-review cap.
    - "!.ox-agent/**"
    - "!internal/assets/embedded/**"

  auto_approvals:
    enabled: true
  # Auto review disabled — reviews trigger manually via `@coderabbitai review`
  # on the PR. Keeps fair-usage quota for deliberate reviews instead of
  # burning it on every push during review loops.
  auto_review:
    enabled: false
    auto_incremental_review: false
    ignore_title_keywords: []
    drafts: false
    base_branches: []
  pre_merge_checks:
    docstrings:
      # CLI/toolchain repo — doc comments welcome but unmeasured (same
      # policy as oxidean/oxl).
      mode: off
