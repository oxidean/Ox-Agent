schema_version: 1
framework:
  name: ox-agent
  distribution: standalone
  binary: ox-agent
  required_version: '>=0.2.0 <0.3.0'
project:
  name: ox-agent
  test_command: go test ./...
workflow:
  default_profile: normal
  profiles:
    normal:
      - discover
      - brainstorm
      - specify
      - plan
      - implement
      - verify
      - ship
skills:
  source: embedded
  enabled:
    - discover-context
    - brainstorm
    - specify
    - adr
    - multi-stage-plan
    - tdd
    - implementation
    - code-review
    - verify
    - discussion
    - progress
    - shipping
    - retrospective
