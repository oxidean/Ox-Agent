version: 2
project_name: ox-agent
before:
  hooks:
    - go mod tidy
builds:
  - id: ox-agent
    main: ./cmd/ox-agent
    binary: ox-agent
    ldflags:
      - -s -w -X github.com/oxidean/Ox-Agent/internal/buildinfo.Version={{ .Version }}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
archives:
  - formats: [tar.gz]
    name_template: 'ox-agent_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
release:
  prerelease: auto
  extra_files:
    - glob: ./install.sh
    - glob: ./install.ps1
