name: Feature request
description: Suggest an idea or improvement for ox-agent.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Who is affected, and what can they not do today? Deferred features activate on a concrete consumer — name the real work that needs this.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should ox-agent do? Command surface, file contracts, packet shapes, and examples all help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use today, or other designs you ruled out.
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - CLI commands (init, doctor, run, collect, ...)
        - Skills, workflows, or pipelines
        - Project state / events journal
        - Install scripts (install.sh / install.ps1)
        - Update / releases
        - Harness integrations
        - Documentation
        - Other
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and the roadmap for duplicates.
          required: true
        - label: I am interested in contributing this myself (see CONTRIBUTING.md).
          required: false
