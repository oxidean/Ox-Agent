name: Bug report
description: Something is not working in ox-agent (CLI, project assets, or release artifacts).
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For security issues, do not file a public issue; see [SECURITY.md](https://github.com/oxidean/Ox-Agent/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The smallest set of commands that triggers the problem — a fresh `ox-agent init` repro is ideal.
      placeholder: |
        1. ox-agent init
        2. ox-agent doctor
        3.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - CLI commands (init, doctor, run, collect, ...)
        - Skills, workflows, or pipelines
        - Project state / events journal
        - Install scripts (install.sh / install.ps1)
        - Update / releases
        - Harness integrations
        - Documentation
        - Other
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - linux/amd64
        - linux/arm64
        - darwin/amd64
        - darwin/arm64
        - windows/amd64
        - Other / multiple
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `ox-agent version`, or `git rev-parse HEAD` for local builds.
      placeholder: e.g. 0.1.3 or a commit SHA
  - type: textarea
    id: logs
    attributes:
      label: Logs and errors
      description: Command output and `ox-agent doctor` output where relevant. Redact tokens and absolute paths you do not want public.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets, tokens, and personal data from logs and screenshots.
          required: true
