name: Tag release

on:
  push:
    branches: [main]

# Serialize tagging: concurrent merges must not race for the same next tag.
concurrency:
  group: release-tagging
  cancel-in-progress: false
  queue: max

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether to tag
        id: gate
        run: |
          if git log -1 --pretty=%B | grep -qiE '\[(skip|no)[ -]release\]'; then
            echo "skip=commit message opts out" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A stable tag already at HEAD (e.g. pushed manually, or left by a
          # run that died between tag push and dispatch) is still dispatched
          # below — tag creation is skipped, the release is not.
          existing="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)"
          if [ -n "$existing" ]; then
            echo "existing=$existing" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute next patch tag
        id: next
        if: steps.gate.outputs.skip == '' && steps.gate.outputs.existing == ''
        run: |
          git fetch --force origin 'refs/tags/*:refs/tags/*' -q
          latest="$(git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -rV | head -n1 || true)"
          if [ -z "$latest" ]; then
            echo "tag=v0.0.1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Queued runs may execute out of push order. Staleness is judged only
          # against release tags already on main's history: if HEAD is an
          # ancestor of the newest on-main tag, a later push already released
          # this content — tagging it with a higher version would hand a higher
          # version to older code. Release tags outside main's history (for
          # example a side-branch tag that contains HEAD) never block tagging;
          # they only advance the next version via `latest` above.
          git fetch origin main -q
          latest_main="$(git tag --merged origin/main -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -rV | head -n1 || true)"
          if [ -n "$latest_main" ]; then
            latest_main_commit="$(git rev-list -n1 "$latest_main")"
            if git merge-base --is-ancestor HEAD "$latest_main_commit"; then
              echo "stale=HEAD is already covered by $latest_main - a newer main commit already owns that release" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "tag=v$(awk -F. '{ $3 += 1; print $1 "." $2 "." $3 }' <<< "${latest#v}")" >> "$GITHUB_OUTPUT"

      # The docs bundle packs from the tagged commit and its manifest version
      # must equal the tag, so the manifest is bumped in a release commit on
      # main first — the tag below then points at a tree that passes the gate.
      - name: Sync docs manifest version
        if: steps.next.outputs.tag != ''
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          set -euo pipefail
          manifest=docs/site/manifest.yaml
          [ -f "$manifest" ] || { echo "no docs/site manifest — skipping"; exit 0; }
          ver="${TAG#v}"
          current="$(sed -nE 's/^version:[[:space:]]*"?([^"[:space:]]*)"?[[:space:]]*$/\1/p' "$manifest" | head -1)"
          if [ "$current" = "$ver" ]; then
            echo "manifest already at $ver"
            exit 0
          fi
          sed -i -E "s/^version: .*/version: \"$ver\"/" "$manifest"
          # No-op (e.g. an unparsable or already-matching line) must not
          # hard-fail the tag — the pack version gate is the real check.
          if git diff --quiet -- "$manifest"; then
            echo "manifest unchanged — nothing to commit"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -am "chore(release): bump docs manifest to $ver"
          # main can advance between checkout and this push — concurrency
          # serializes runs, not merges. Rebase the bump commit and retry.
          for i in 1 2 3; do
            if git push origin HEAD:main; then break; fi
            [ "$i" = 3 ] && { echo "::error::main advanced past this run — push failed after 3 tries; rerun tag-release"; exit 1; }
            git fetch origin main
            git rebase origin/main || { git rebase --abort; echo "::error::rebase onto advancing main failed"; exit 1; }
          done

      - name: Create and push tag
        if: steps.next.outputs.tag != ''
        run: |
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -a "${{ steps.next.outputs.tag }}" -m "Release ${{ steps.next.outputs.tag }}"
          git push origin "${{ steps.next.outputs.tag }}"

      # Tags pushed by GITHUB_TOKEN do not trigger `on: push: tags` workflows,
      # so the release is dispatched explicitly against the tag. Dispatch is
      # skipped when the tag's release or a release run already exists, which
      # also makes a rerun after a failed dispatch safe.
      - name: Dispatch release workflow
        if: steps.gate.outputs.skip == '' && steps.next.outputs.stale == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ steps.next.outputs.tag || steps.gate.outputs.existing }}
        run: |
          if [ -z "$TARGET" ]; then
            echo "nothing to release"
            exit 0
          fi
          if gh release view "$TARGET" >/dev/null 2>&1; then
            echo "release $TARGET already published"
            exit 0
          fi
          if [ "$(gh run list --workflow release.yml --branch "$TARGET" --json databaseId --jq 'length')" -gt 0 ]; then
            echo "release run for $TARGET already started"
            exit 0
          fi
          gh workflow run release.yml --ref "$TARGET" -f tag="$TARGET"
