name: Tag release

on:
  push:
    branches: [main]

# Serialize tagging: concurrent merges must not race for the same next tag.
concurrency:
  group: release-tagging
  cancel-in-progress: false
  queue: max

permissions:
  contents: write
  actions: write
  # The docs-manifest bump merges through a bot-opened PR — main's ruleset
  # requires changes to arrive via pull request.
  pull-requests: write

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether to tag
        id: gate
        run: |
          if git log -1 --pretty=%B | grep -qiE '\[(skip|no)[ -]release\]'; then
            echo "skip=commit message opts out" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A stable tag already at HEAD (e.g. pushed manually, or left by a
          # run that died between tag push and dispatch) is still dispatched
          # below — tag creation is skipped, the release is not.
          existing="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)"
          if [ -z "$existing" ]; then
            # Recovery: the release tag sits on the docs-manifest bump merge,
            # a direct child of HEAD. A run that died between tag push and
            # dispatch left it there — a rerun on the same commit must find
            # and dispatch it, not mint the next version over the same tree.
            # Only on-main bump commits qualify: a tagged child on another
            # branch would publish an unrelated tree under the tag.
            git fetch origin main -q
            for child in $(git rev-list --all --children \
                | awk -v s="$(git rev-parse HEAD)" '$1==s {$1=""; print}'); do
              git merge-base --is-ancestor "$child" origin/main 2>/dev/null || continue
              git log -1 --format=%s "$child" \
                | grep -q '^chore(release): bump docs manifest to ' || continue
              existing="$(git tag --points-at "$child" \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -rV | head -n1 || true)"
              [ -n "$existing" ] && break
            done
          fi
          if [ -n "$existing" ]; then
            echo "existing=$existing" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute next patch tag
        id: next
        if: steps.gate.outputs.skip == '' && steps.gate.outputs.existing == ''
        run: |
          git fetch --force origin 'refs/tags/*:refs/tags/*' -q
          latest="$(git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -rV | head -n1 || true)"
          if [ -z "$latest" ]; then
            echo "tag=v0.0.1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Queued runs may execute out of push order. Staleness is judged only
          # against release tags already on main's history: if HEAD is an
          # ancestor of the newest on-main tag, a later push already released
          # this content — tagging it with a higher version would hand a higher
          # version to older code. Release tags outside main's history (for
          # example a side-branch tag that contains HEAD) never block tagging;
          # they only advance the next version via `latest` above.
          git fetch origin main -q
          latest_main="$(git tag --merged origin/main -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -rV | head -n1 || true)"
          if [ -n "$latest_main" ]; then
            latest_main_commit="$(git rev-list -n1 "$latest_main")"
            if git merge-base --is-ancestor HEAD "$latest_main_commit"; then
              echo "stale=HEAD is already covered by $latest_main - a newer main commit already owns that release" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "tag=v$(awk -F. '{ $3 += 1; print $1 "." $2 "." $3 }' <<< "${latest#v}")" >> "$GITHUB_OUTPUT"

      # The docs bundle packs from the tagged commit and its manifest version
      # must equal the tag, so the manifest is bumped in a release commit on
      # main first — the tag below then points at a tree that passes the gate.
      - name: Sync docs manifest version
        if: steps.next.outputs.tag != ''
        id: sync
        env:
          TAG: ${{ steps.next.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          emit() { echo "sha=$1" >> "$GITHUB_OUTPUT"; }
          manifest=docs/site/manifest.yaml
          head="$(git rev-parse HEAD)"
          [ -f "$manifest" ] || { echo "no docs/site manifest — skipping"; emit "$head"; exit 0; }
          ver="${TAG#v}"
          getver() { sed -nE 's/^version[[:space:]]*:[[:space:]]*"?([^"[:space:]]*)"?[[:space:]]*$/\1/p' | head -1; }
          current="$(getver < "$manifest" || true)"
          if [ "$current" = "$ver" ]; then
            echo "manifest already at $ver"
            emit "$head"
            exit 0
          fi
          git fetch origin main -q
          # A previous attempt may have merged the bump but died before
          # tagging — reuse the commit that set the version rather than
          # opening a second bump PR.
          bumped="$(git show "origin/main:$manifest" 2>/dev/null | getver || true)"
          if [ "$bumped" = "$ver" ]; then
            # Tag the commit that set the version, not the latest commit
            # that touched the manifest — a later non-version edit must
            # not become the release cut.
            target=""
            for c in $(git rev-list --first-parent origin/main -- "$manifest"); do
              v="$(git show "$c:$manifest" 2>/dev/null | getver || true)"
              [ "$v" = "$ver" ] || break
              target="$c"
            done
            [ -n "$target" ] || { echo "::error::no commit on main carries manifest version $ver"; exit 1; }
            emit "$target"
            exit 0
          fi
          sed -i -E "s/^version[[:space:]]*:.*/version: \"$ver\"/" "$manifest"
          # The version line exists but can't be parsed or rewritten — the
          # tag would carry a stale manifest and the docs pack fails later.
          if git diff --quiet -- "$manifest"; then
            echo "::error::could not set docs manifest version to $ver (missing or unparseable version line)"
            exit 1
          fi
          # Open the bump as a PR and squash-merge it: main rejects direct
          # pushes. The merge commit carries the matching manifest and sits
          # on main, so it is the tag target.
          branch="docs-manifest-bump/$TAG"
          git checkout -b "$branch"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -am "chore(release): bump docs manifest to $ver"
          git push -f origin "$branch"
          expected_sha="$(git rev-parse HEAD)"
          # Pin resolution to base=main and the pushed head SHA — head
          # branches can carry PRs against other bases, and the merge must
          # target this exact bump commit. A lookup failure is not an empty
          # result: retry, then refuse to create a possible duplicate.
          resolve_pr() {
            local out
            for _ in 1 2 3; do
              if out="$(gh pr list --head "$branch" --base main --state open \
                  --json number,baseRefName,headRefOid \
                  --jq ".[] | select(.baseRefName==\"main\" and .headRefOid==\"$expected_sha\") | .number" \
                  | head -1)"; then
                printf '%s\n' "$out"
                return 0
              fi
              sleep 10
            done
            return 1
          }
          pr="$(resolve_pr)" || { echo "::error::bump PR lookup failed for $branch — refusing to create a duplicate"; exit 1; }
          if [ -z "$pr" ]; then
            gh pr create --base main --head "$branch" \
              --title "chore(release): bump docs manifest to $ver" \
              --body "Automated docs-manifest sync for $TAG — the docs bundle packs from the tagged tree and gates on manifest.version == tag. @coderabbitai ignore" \
              || { echo "::error::gh pr create failed for $branch"; exit 1; }
            # gh pr create prints only the URL — re-read the number via list.
            pr="$(resolve_pr)" || { echo "::error::post-create bump PR lookup failed for $branch"; exit 1; }
          fi
          [ -n "$pr" ] || { echo "::error::could not resolve bump PR number for $branch"; exit 1; }
          # The bump PR is bot-authored: its pull_request runs arrive held at
          # action_required (GITHUB_TOKEN can't self-trigger), so required
          # checks never report and branch policy blocks the merge. Approve
          # held runs every poll — late-spawning runs get caught too — and
          # wait on mergeStateStatus rather than mergeable, which reports
          # conflicts only and stays MERGEABLE while required checks pend.
          state=""
          merged_gate=0
          updates=0
          # ~50min of polling inside the 60min job timeout — slower legs must
          # not hit "never reached a clean state" while budget remains.
          deadline=$((SECONDS + 3000))
          while [ "$SECONDS" -lt "$deadline" ]; do
            # Held runs surface under different markers across API shapes —
            # match all reported forms, and scope to the current head SHA so
            # stale runs on older heads are never approved. -X GET keeps the
            # -f fields as query params; without it gh api posts them as a
            # body and the runs endpoint 404s, killing the approve pass.
            if held_json="$(gh api -X GET "repos/${{ github.repository }}/actions/runs" \
                -f "branch=$branch" -f event=pull_request -f "head_sha=$expected_sha" \
                -f per_page=50 2>/dev/null)"; then
              held="$(printf '%s' "$held_json" | jq -r '.workflow_runs[] | select(.status=="waiting" or .status=="action_required" or .conclusion=="action_required") | .id' 2>/dev/null || true)"
            else
              held=""
              echo "::warning::held-run query failed — approve pass skipped this round"
            fi
            for rid in $held; do
              if err="$(gh api -X POST "repos/${{ github.repository }}/actions/runs/$rid/approve" 2>&1)"; then
                echo "approved held run $rid"
              else
                echo "::warning::approve call failed for held run $rid — $err"
              fi
            done
            state="$(gh pr view "$pr" --json mergeStateStatus --jq '.mergeStateStatus' 2>/dev/null)" || {
              echo "::warning::could not read merge state for bump PR #$pr — retrying"
              sleep 20
              continue
            }
            case "$state" in
              CONFLICTING|DIRTY)
                echo "::error::bump PR #$pr conflicts with main — rerun tag-release"
                exit 1 ;;
            esac
            # Gate on every check, not just required ones: a failed check on
            # the release cut stops the tag, and a still-pending check keeps
            # the loop waiting. cancel counts as fail — a cancelled required
            # check must not slip through as "settled". ACTION_REQUIRED runs
            # are held, not failed — the approve pass above releases them.
            # A failed query is not a pass — retry it.
            # gh pr checks exits non-zero when any check pends/fails even with
            # --json — the read guard tests stdout, so JSON still lands first.
            if ! read -r fails pending < <(gh pr checks "$pr" --json bucket,state \
                --jq '"\([.[]|select((.bucket=="fail" or .bucket=="cancel") and .state!="ACTION_REQUIRED")]|length) \([.[]|select(.bucket=="pending" or .state=="ACTION_REQUIRED")]|length)"' 2>/dev/null); then
              echo "::warning::could not read checks for bump PR #$pr — retrying"
              sleep 20
              continue
            fi
            if [ "$fails" != "0" ]; then
              echo "::error::bump PR #$pr has a failing check — rerun tag-release"
              gh pr checks "$pr" || true
              exit 1
            fi
            case "$state" in
              CLEAN) merged_gate=1; break ;;
              UNSTABLE) if [ "$pending" = "0" ]; then merged_gate=1; break; fi ;;
              # BEHIND fails the merge outright when the ruleset requires
              # up-to-date branches. update-branch via the API won't spawn
              # checks under GITHUB_TOKEN, so merge main locally and push —
              # the synchronize runs arrive held like the original ones and
              # the approve loop picks them up once expected_sha tracks the
              # new head.
              BEHIND)
                if [ "$pending" = "0" ]; then
                  if [ "$updates" -lt 3 ]; then
                    updates=$((updates+1))
                    if git merge --abort 2>/dev/null; git fetch origin main -q \
                      && git -c user.name="github-actions[bot]" \
                           -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                           merge --no-edit origin/main >/dev/null 2>&1 \
                      && git push -f origin "$branch" >/dev/null 2>&1; then
                      expected_sha="$(git rev-parse HEAD)"
                      # The PR follows the branch — headRefOid lags the push
                      # briefly, so keep the old number if re-resolution
                      # hasn't caught up yet.
                      newpr="$(resolve_pr || true)"
                      [ -n "$newpr" ] && pr="$newpr"
                      echo "bump PR #$pr BEHIND — merged main and pushed ($updates/3)"
                    else
                      echo "::warning::could not merge main into bump branch — retrying"
                    fi
                  else
                    echo "::error::bump PR #$pr could not be brought up to date — rerun tag-release"
                    exit 1
                  fi
                fi ;;
            esac
            sleep 20
          done
          if [ "$merged_gate" != "1" ]; then
            echo "::error::bump PR #$pr never reached a clean state (mergeStateStatus=$state)"
            gh pr checks "$pr" || true
            exit 1
          fi
          # Pin the squash subject/body: the default body can fold in a
          # Co-authored-by trailer for the bot, which the attribution gate
          # scans on the post-merge push run.
          merged_now=0
          for i in 1 2 3; do
            if gh pr merge "$pr" --squash --delete-branch \
              --subject "chore(release): bump docs manifest to $ver (#$pr)" \
              --body "Automated docs-manifest sync for $TAG."; then
              merged_now=1
              break
            fi
            # gh pr merge fails non-zero even when the merge landed but a
            # trailing op (e.g. --delete-branch) errored — probe state first.
            if [ "$(gh pr view "$pr" --json state --jq '.state' 2>/dev/null || true)" = "MERGED" ]; then
              merged_now=1
              break
            fi
            [ "$i" = "3" ] || sleep 5
          done
          [ "$merged_now" = "1" ] || { echo "::error::bump PR #$pr merge refused after clean state"; exit 1; }
          mc=""
          for i in $(seq 1 15); do
            mc="$(gh pr view "$pr" --json mergeCommit,state --jq 'select(.state=="MERGED") | .mergeCommit.oid' || true)"
            [ -n "$mc" ] && break
            sleep 2
          done
          [ -n "$mc" ] || { echo "::error::bump PR #$pr did not report merged"; exit 1; }
          emit "$mc"

      - name: Create and push tag
        if: steps.next.outputs.tag != ''
        env:
          TAG: ${{ steps.next.outputs.tag }}
          SHA: ${{ steps.sync.outputs.sha }}
        run: |
          set -euo pipefail
          # The tag target may be a remote-only bump merge commit — refresh
          # origin/main so it resolves locally.
          git fetch origin main -q
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -a "$TAG" -m "Release $TAG" "$SHA"
          git push origin "$TAG"

      # Tags pushed by GITHUB_TOKEN do not trigger `on: push: tags` workflows,
      # so the release is dispatched explicitly against the tag. Dispatch is
      # skipped when the tag's release or a release run already exists, which
      # also makes a rerun after a failed dispatch safe.
      - name: Dispatch release workflow
        if: steps.gate.outputs.skip == '' && steps.next.outputs.stale == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ steps.next.outputs.tag || steps.gate.outputs.existing }}
        run: |
          if [ -z "$TARGET" ]; then
            echo "nothing to release"
            exit 0
          fi
          if gh release view "$TARGET" >/dev/null 2>&1; then
            echo "release $TARGET already published"
            exit 0
          fi
          if [ "$(gh run list --workflow release.yml --branch "$TARGET" --json databaseId --jq 'length')" -gt 0 ]; then
            echo "release run for $TARGET already started"
            exit 0
          fi
          gh workflow run release.yml --ref "$TARGET" -f tag="$TARGET"
