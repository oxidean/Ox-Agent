name: Tag release

on:
  push:
    branches: [main]

# Serialize tagging: concurrent merges must not race for the same next tag.
concurrency:
  group: release-tagging
  cancel-in-progress: false
  queue: max

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether to tag
        id: gate
        run: |
          if git log -1 --pretty=%B | grep -qiE '\[(skip|no)[ -]release\]'; then
            echo "skip=commit message opts out" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A stable tag already at HEAD (e.g. pushed manually, or left by a
          # run that died between tag push and dispatch) is still dispatched
          # below — tag creation is skipped, the release is not.
          existing="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)"
          if [ -n "$existing" ]; then
            echo "existing=$existing" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute next patch tag
        id: next
        if: steps.gate.outputs.skip == '' && steps.gate.outputs.existing == ''
        run: |
          git fetch --force origin 'refs/tags/*:refs/tags/*' -q
          latest="$(git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -rV | head -n1)"
          if [ -z "$latest" ]; then
            echo "tag=v0.0.1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Queued runs may execute out of push order. If HEAD is an ancestor
          # of the latest tagged commit, that tag already covers this commit's
          # content — tagging it with a higher version would hand a higher
          # version to older code. Release tags outside main's history are not
          # ancestors of a newer main push, so they never block auto-tagging;
          # they only advance the next version number.
          latest_commit="$(git rev-list -n1 "$latest")"
          if git merge-base --is-ancestor HEAD "$latest_commit"; then
            echo "stale=HEAD is already covered by $latest - a newer commit already owns that release" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "tag=v$(awk -F. '{ $3 += 1; print $1 "." $2 "." $3 }' <<< "${latest#v}")" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.next.outputs.tag != ''
        run: |
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -a "${{ steps.next.outputs.tag }}" -m "Release ${{ steps.next.outputs.tag }}"
          git push origin "${{ steps.next.outputs.tag }}"

      # Tags pushed by GITHUB_TOKEN do not trigger `on: push: tags` workflows,
      # so the release is dispatched explicitly against the tag. Dispatch is
      # skipped when the tag's release or a release run already exists, which
      # also makes a rerun after a failed dispatch safe.
      - name: Dispatch release workflow
        if: steps.gate.outputs.skip == '' && steps.next.outputs.stale == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ steps.next.outputs.tag || steps.gate.outputs.existing }}
        run: |
          if [ -z "$TARGET" ]; then
            echo "nothing to release"
            exit 0
          fi
          if gh release view "$TARGET" >/dev/null 2>&1; then
            echo "release $TARGET already published"
            exit 0
          fi
          if [ "$(gh run list --workflow release.yml --branch "$TARGET" --json databaseId --jq 'length')" -gt 0 ]; then
            echo "release run for $TARGET already started"
            exit 0
          fi
          gh workflow run release.yml --ref "$TARGET" -f tag="$TARGET"
