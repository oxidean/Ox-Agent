name: Prepare release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check branch and worktree
        run: |
          test "$(git branch --show-current)" = main
          test -z "$(git status --porcelain)"

      - name: Calculate next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          version="$(bun scripts/release-version.mjs "$BUMP")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Configure release commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate and commit release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bun run build
          bun test
          bun run validate
          bun run validate-package
          git add package.json
          git commit -m "v${VERSION}: release ${VERSION}"
          bun scripts/validate-release.mjs HEAD "v${VERSION}"

      - name: Check tag is unused
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: test -z "$(git ls-remote --tags origin "refs/tags/v${VERSION}")"

      - name: Tag and push release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag -a "v${VERSION}" -m "v${VERSION}: release ${VERSION}"
          git push origin main
          git push origin "v${VERSION}"
