name: Go CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/ox-agent
      - run: scripts/check-assets.sh
        shell: bash
      - name: Check vendored skill scripts parse
        shell: bash
        run: |
          PY=python3; command -v python3 >/dev/null 2>&1 || PY=python
          find skills -path '*/scripts/*.py' -exec "$PY" -c 'import sys; [compile(open(f,"rb").read(), f, "exec") for f in sys.argv[1:]]' {} +
