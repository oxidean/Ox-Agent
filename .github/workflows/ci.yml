name: CI

on:
  push:
    branches: [main, init]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Build, test, and validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Run tests
        run: bun test

      - name: Validate Ox-Agent repository state
        run: bun run validate

      - name: Validate package contents
        run: bun run validate-package

      - name: Smoke test CLI in a temporary project
        shell: bash
        run: |
          set -euo pipefail
          sandbox="$(mktemp -d)"
          trap 'rm -rf "$sandbox"' EXIT
          (
            cd "$sandbox"
            bun "$GITHUB_WORKSPACE/dist/cli.js" init
            bun "$GITHUB_WORKSPACE/dist/cli.js" doctor
            bun "$GITHUB_WORKSPACE/dist/cli.js" start "CI smoke test"
            bun "$GITHUB_WORKSPACE/dist/cli.js" status
          )
