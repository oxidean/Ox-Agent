name: CI

on:
  push:
    branches: [main, init]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Build, test, and validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Validate Ox-Agent repository state
        run: npm run validate

      - name: Smoke test CLI in a temporary project
        shell: bash
        run: |
          set -euo pipefail
          sandbox="$(mktemp -d)"
          trap 'rm -rf "$sandbox"' EXIT
          (
            cd "$sandbox"
            node "$GITHUB_WORKSPACE/dist/cli.js" init
            node "$GITHUB_WORKSPACE/dist/cli.js" doctor
            node "$GITHUB_WORKSPACE/dist/cli.js" start "CI smoke test"
            node "$GITHUB_WORKSPACE/dist/cli.js" status
          )
