name: Release Go binary

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.ref_name }}
        run: echo "tag=${INPUT_TAG:-$EVENT_TAG}" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test and vet
        run: |
          go test ./...
          go vet ./...

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.3

      - name: Release binary artifacts
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Docs pack runs as a job here rather than on push.tags: tags pushed by
  # tag-release.yml use GITHUB_TOKEN and never fire tag-push workflows — the
  # tag is released via the explicit release.yml dispatch, so this job covers
  # that path and manual tag pushes alike. Running after goreleaser also
  # guarantees the Release the bundle attaches to already exists.
  docs:
    needs: release
    permissions:
      contents: write
    uses: oxidean/docs-manifest/.github/workflows/release.yml@v0.1.4
    with:
      tag: ${{ needs.release.outputs.tag }}
      product: ox-agent
    secrets:
      site_dispatch_token: ${{ secrets.DOCS_SITE_DISPATCH_TOKEN }}
